<style>
/* One scene and one control: the shutter-and-wet-glass backdrop, and an enamel plate hanging from the shutter's
   bottom bar on two chains. The plate is the download. Colours are the game's exit plates (ui/exit_style.gd). */
@font-face { font-family: "m5x7"; src: url("assets/m5x7.woff2") format("woff2"); font-display: block; }
:root {
  --soot: #0b0a09; --bone: #e6dcc2; --bone-dim: #9a917c; --enamel: #2c4a33; --enamel-hi: #36593e; --oxblood: #5b1c18;
  --sodium: #ffb347;
  --shut: 0.22;            /* the shutter's bottom edge, 0..1 of the viewport height (JS follows the shader) */
  --swing: 0deg; --glow: 0; --lamp: 1;
  --pixel: "m5x7", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--soot); overflow: hidden; }
body { -webkit-tap-highlight-color: transparent; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; opacity: 0; transition: opacity 1s ease; }
html.gl-ready #bg { opacity: 1; }
/* No WebGL: the same scene in CSS, a shutter down to --shut over a sodium haze. */
.fallback {
  position: fixed; inset: 0; pointer-events: none; transition: opacity 1s ease;
  background:
    repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.4) 0 2px, rgba(140, 128, 108, 0.12) 2px 6px, rgba(0, 0, 0, 0.3) 6px 12px) top / 100% 22vh no-repeat,
    linear-gradient(180deg, #24211d 0 22vh, #0c0a09 22vh 22.4vh, transparent 22.4vh),
    radial-gradient(22vmax 18vmax at 50% 44%, rgba(255, 170, 70, 0.2), transparent 70%),
    radial-gradient(26vmax 20vmax at 78% 50%, rgba(255, 160, 60, 0.26), transparent 70%),
    radial-gradient(70vmax 18vmax at 72% 84%, rgba(255, 150, 60, 0.1), transparent 70%),
    linear-gradient(180deg, #07080a 0%, #110e0b 55%, #0a0908 70%, #050404 100%);
}
html.gl-ready .fallback { opacity: 0; }

/* The plate hangs from the shutter's bottom edge, centred; it rides the shutter and swings with it. */
.hang {
  position: fixed; left: 50%; top: calc(var(--shut) * 100vh - 4px); top: calc(var(--shut) * 100svh - 4px);
  width: min(430px, calc(100vw - 32px)); transform: translateX(-50%) rotate(var(--swing)); transform-origin: 50% 0;
  padding-top: 64px; opacity: 0;
}
html.ready .hang { opacity: 1; transition: opacity 0.4s ease; }
.chain {
  position: absolute; top: 0; width: 6px; height: 68px;
  background: repeating-linear-gradient(180deg, #6e675a 0 5px, #2a2622 5px 7px, #8a8171 7px 10px, #2a2622 10px 12px);
  box-shadow: 1px 0 0 rgba(0, 0, 0, 0.7);
}
.chain.l { left: 18%; } .chain.r { right: 18%; }
.chain::after { /* the ring through the plate's hole */
  content: ""; position: absolute; left: -4px; bottom: -8px; width: 14px; height: 14px; border-radius: 50%;
  border: 3px solid #7d7566; box-shadow: 0 1px 0 #000;
}

.plate {
  position: relative; display: block; text-decoration: none; color: var(--bone); text-align: center;
  padding: 20px 22px 14px; cursor: pointer; outline: none;
  background:
    radial-gradient(90% 70% at 50% 0%, rgba(255, 196, 120, calc(0.1 + 0.18 * var(--glow))), transparent 70%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 35%),
    linear-gradient(180deg, transparent 70%, rgba(6, 10, 7, 0.55)),
    var(--enamel);
  border: 3px solid var(--bone);
  box-shadow:
    inset 0 0 0 3px var(--enamel), inset 0 0 0 5px rgba(230, 220, 194, 0.28),
    6px 8px 0 rgba(0, 0, 0, 0.72),
    0 0 calc(30px + 50px * var(--glow)) rgba(255, 170, 80, calc(0.1 + 0.25 * var(--glow)));
  transition: transform 0.16s cubic-bezier(0.2, 0.9, 0.3, 1.4), box-shadow 0.25s ease, background-color 0.25s ease;
  -webkit-font-smoothing: none;
}
.plate::before, .plate::after { /* rivets */
  content: ""; position: absolute; top: 10px; width: 9px; height: 9px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #efe6cf, #8f8672 60%, #3a342c); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.7);
}
.plate::before { left: 10px; } .plate::after { right: 10px; }
.plate:hover, .plate:focus-visible { background-color: var(--enamel-hi); }
.plate:focus-visible { box-shadow: inset 0 0 0 3px var(--enamel), inset 0 0 0 5px rgba(230, 220, 194, 0.28), 6px 8px 0 rgba(0, 0, 0, 0.72), 0 0 0 3px var(--sodium); }
.plate:active, .plate.pressed { transform: translateY(4px) scale(0.985); box-shadow: inset 0 0 0 3px var(--enamel), inset 0 0 0 5px rgba(230, 220, 194, 0.28), 2px 3px 0 rgba(0, 0, 0, 0.72), 0 0 90px rgba(255, 180, 90, 0.4); }
.row { display: flex; align-items: center; justify-content: center; gap: 16px; }
.letter {
  flex: none; width: 52px; height: 52px; display: grid; place-items: center; border: 3px solid var(--bone);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 50%), #24402b; box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.7);
  overflow: hidden;
}
.letter svg { width: 26px; height: 26px; fill: var(--bone); }
html.js:not(.still) .plate:hover .letter svg, html.js:not(.still) .plate:focus-visible .letter svg { animation: drop 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
@keyframes drop { 0% { transform: translateY(-34px); } 45%, 70% { transform: none; } 100% { transform: translateY(34px); } }
.word { font: 64px/0.8 var(--pixel); letter-spacing: 0.02em; text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.8); padding-bottom: 6px; }
.stamp {
  display: block; margin-top: 12px; padding-top: 7px; border-top: 1px dashed rgba(230, 220, 194, 0.28);
  font: 16px/1 var(--pixel); letter-spacing: 0.16em; color: var(--bone-dim); text-shadow: 1px 1px 0 #000;
}
.plate .soot { /* run-off under the plate */
  position: absolute; left: 16%; right: 28%; top: 100%; height: 22px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(8, 6, 5, 0.55) 20%, transparent 34%, rgba(8, 6, 5, 0.4) 60%, transparent 72%, rgba(8, 6, 5, 0.5) 86%, transparent);
  -webkit-mask-image: linear-gradient(180deg, #000, transparent); mask-image: linear-gradient(180deg, #000, transparent);
}

@media (max-width: 480px) {
  .hang { padding-top: 52px; }
  .chain { height: 56px; }
  .word { font-size: 48px; }
  .letter { width: 44px; height: 44px; }
  .row { gap: 12px; }
  .plate { padding: 18px 16px 12px; }
}
@media (max-width: 340px) { .word { font-size: 32px; padding-bottom: 3px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 0.001s !important; }
}
html.still *, html.still *::before, html.still *::after { animation: none !important; transition-duration: 0.001s !important; }
</style>

<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="fallback" aria-hidden="true"></div>
<main>
  <h1 class="sr-only">Closing Time</h1>
  <div class="hang" id="hang">
    <span class="chain l" aria-hidden="true"></span><span class="chain r" aria-hidden="true"></span>
    <a class="plate" id="dl" href="{{ZIP_URL}}"
       title="Closing Time for Windows 10/11 · {{DATE}} · commit {{COMMIT}} · {{SIZE_MB}} MB · SHA-256 {{SHA256}} · unzip, run ClosingTime.exe (SmartScreen: More info, Run anyway)">
      <span class="row">
        <span class="letter" aria-hidden="true"><svg viewBox="0 0 11 11" shape-rendering="crispEdges"><path d="M4 0h3v5h3v1h-1v1h-1v1h-1v1h-1v1h-1v-1h-1v-1h-1v-1h-1v-1h-1v-1h3z"/></svg></span>
        <span class="word">DOWNLOAD</span>
      </span>
      <span class="stamp" id="stamp">WINDOWS · {{SIZE_STAMP}} MB · {{DATE_STAMP}}</span>
      <span class="soot" aria-hidden="true"></span>
    </a>
  </div>
</main>

<script type="x-shader/x-fragment" id="frag">
{{SHADER}}
</script>
<script>
(function () {
  'use strict';
  var root = document.documentElement;
  var q = new URLSearchParams(location.search);
  var motion = matchMedia('(prefers-reduced-motion: reduce)');
  var still = motion.matches || q.has('still');
  var $ = function (s) { return document.querySelector(s); };
  var canvas = $('#bg'), plate = $('#dl'), hang = $('#hang'), stamp = $('#stamp');
  var REST = 0.22;
  var gl = null, loc = {}, W = 0, H = 0, raf = 0, last = 0, acc = 0, visible = true;
  // shut: the shutter's bottom edge (0..1 from the top); hover lifts it a little, a press jolts it up.
  var S = { t: 0, shut: REST, vel: 0, lamp: 1, glow: 0, glowT: 0, look: [0, 0], lookT: [0, 0] };

  function setCss() {
    root.style.setProperty('--shut', S.shut.toFixed(4));
    root.style.setProperty('--swing', (still ? 0 : Math.max(-4, Math.min(4, -S.vel * 3))).toFixed(2) + 'deg');
    root.style.setProperty('--glow', S.glow.toFixed(3));
    root.style.setProperty('--lamp', S.lamp.toFixed(2));
  }

  function initGl() {
    if (q.has('nogl')) return false;
    try { gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' }); } catch (e) { gl = null; }
    if (!gl) return false;
    function sh(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn('closing-time backdrop:', gl.getShaderInfoLog(s)); return null; }
      return s;
    }
    var v = sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }');
    var f = sh(gl.FRAGMENT_SHADER, $('#frag').textContent);
    if (!v || !f) return false;
    var prog = gl.createProgram();
    gl.attachShader(prog, v); gl.attachShader(prog, f); gl.bindAttribLocation(prog, 0, 'a'); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    ['u_res', 'u_time', 'u_shut', 'u_vel', 'u_lamp', 'u_look', 'u_glow', 'u_plate'].forEach(function (n) { loc[n] = gl.getUniformLocation(prog, n); });
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); gl = null; root.classList.remove('gl-ready'); });
    return true;
  }

  function size() {
    H = Math.max(200, Math.min(300, Math.round(innerHeight / 3)));
    W = Math.max(120, Math.round(H * innerWidth / Math.max(1, innerHeight)));
    canvas.width = W; canvas.height = H;
    if (gl) gl.viewport(0, 0, W, H);
    draw();
  }

  // The sodium lamp: a hum, and every few seconds a stutter. Steady while you reach for the plate.
  var nextStutter = 3 + Math.random() * 4, stutterEnd = 0;
  function lampAt(t) {
    if (still) return 1;
    if (S.glowT > 0) { stutterEnd = 0; return 1; }
    if (t > nextStutter && !stutterEnd) stutterEnd = t + 0.25 + Math.random() * 0.5;
    if (stutterEnd && t < stutterEnd) return Math.sin(t * 90) > 0.2 ? 0.35 : 1;
    if (stutterEnd) { stutterEnd = 0; nextStutter = t + 4 + Math.random() * 7; }
    return 0.94 + 0.06 * Math.sin(t * 50) * Math.sin(t * 3.1);
  }

  function draw() {
    if (!gl) return;
    var r = plate.getBoundingClientRect();
    gl.uniform2f(loc.u_res, W, H);
    gl.uniform1f(loc.u_time, S.t % 1000);
    gl.uniform1f(loc.u_shut, S.shut);
    gl.uniform1f(loc.u_vel, Math.min(3, Math.abs(S.vel)));
    gl.uniform1f(loc.u_lamp, S.lamp);
    gl.uniform2f(loc.u_look, S.look[0], S.look[1]);
    gl.uniform1f(loc.u_glow, S.glow);
    gl.uniform2f(loc.u_plate, (r.left + r.width / 2) / innerWidth, 1 - (r.top + r.height / 2) / innerHeight);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    root.classList.add('gl-ready');
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (!visible) return;
    var dt = Math.min(0.1, (now - (last || now)) / 1000);
    last = now;
    acc += dt;
    if (acc < 1 / 30) return; // 30 fps, like the game's captures
    var step = acc; acc = 0;
    S.t += step;
    var target = !gl ? REST : S.t < 0.55 ? -0.06 : REST - 0.06 * S.glowT;
    var a = 38 * (target - S.shut) - 7.5 * S.vel;
    S.vel += a * step; S.shut += S.vel * step;
    S.glow += (S.glowT - S.glow) * Math.min(1, step * 6);
    S.lamp = lampAt(S.t);
    S.look[0] += (S.lookT[0] - S.look[0]) * Math.min(1, step * 3);
    S.look[1] += (S.lookT[1] - S.look[1]) * Math.min(1, step * 3);
    setCss();
    draw();
  }

  if (initGl()) {
    if (!still) S.shut = -0.06;
    size();
    addEventListener('resize', size);
  }
  if (!still) {
    addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse') return;
      S.lookT[0] = (e.clientX / innerWidth) * 2 - 1; S.lookT[1] = (e.clientY / innerHeight) * 2 - 1;
    }, { passive: true });
    document.addEventListener('visibilitychange', function () { visible = document.visibilityState === 'visible'; last = 0; });
    raf = requestAnimationFrame(frame);
  } else {
    S.t = 12; setCss(); draw();
    addEventListener('resize', function () { setCss(); draw(); });
  }
  root.classList.add('ready');

  // Reaching for the plate lifts the shutter a touch and lets the light out; a press jolts it up on its springs.
  function reach(on) { S.glowT = on ? 1 : 0; if (still) { S.glow = S.glowT; setCss(); draw(); } }
  plate.addEventListener('pointerenter', function () { reach(true); });
  plate.addEventListener('pointerleave', function () { reach(false); });
  plate.addEventListener('focus', function () { reach(true); });
  plate.addEventListener('blur', function () { reach(false); });
  plate.addEventListener('click', function () {
    // The link starts the download; this is only the show.
    if (!still && gl) { S.vel -= 1.9; S.glow = 1.6; }
    plate.classList.add('pressed');
    setTimeout(function () { plate.classList.remove('pressed'); }, 160);
    var was = stamp.textContent;
    stamp.textContent = 'DOWNLOADING · UNZIP, RUN THE EXE';
    setTimeout(function () { stamp.textContent = was; }, 4000);
  });
  motion.addEventListener && motion.addEventListener('change', function (e) { if (e.matches) location.reload(); });
})();
</script>
</body>
